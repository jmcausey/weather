services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cl}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cl}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-this-secret}
      CURRENT_LOCATION: ${CURRENT_LOCATION:-Athens,TX}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      LOCATIONS_FILE: /app/data/locations/locations.json
    command: >
      sh -c "python -c 'from weather import create_app; create_app()' &&
             gunicorn --bind 0.0.0.0:5002 --workers 2 app:app"
    ports:
      - "${APP_PORT:-5002}:5002"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - cl_shared_data

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cl}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cl}
      CURRENT_LOCATION: ${CURRENT_LOCATION:-Athens,TX}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      LOCATIONS_FILE: /app/data/locations/locations.json
    command: python scheduler.py
    depends_on:
      postgres:
        condition: service_started
    networks:
      - cl_shared_data

networks:
  cl_shared_data:
    external: true
    name: cl_shared_data
