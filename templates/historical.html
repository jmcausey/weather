{% extends "base.html" %}
{% block title %}Historical Weather Data{% endblock %}
{% block content %}
<div class="weather-page">
  <div class="page-heading"><div><h1>Historical Weather Data</h1><span class="location-label">Collected observations</span></div></div>
  <form method="GET" action="{{ url_for('weather.historical') }}" class="location-form">
    <label for="city">Location</label>
    <select name="city" id="city"><option value="">All Cities</option>{% for c in cities %}<option value="{{ c }}" {% if selected_city == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
    <button type="submit">Filter</button>
  </form>
  {% if table %}<div class="table-responsive">{{ table|safe }}</div>{% else %}<p class="empty-state">No historical weather data available.</p>{% endif %}
</div>
{% endblock %}
